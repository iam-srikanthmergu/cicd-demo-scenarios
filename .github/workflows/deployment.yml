name: CI-CD Troubleshooting Demo

on:
  push:
    branches:
      - main

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building application..."
          sleep 3
          echo "Build completed successfully"


  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y netcat-openbsd

      - name: Run tests
        run: |
          echo "Starting tests..."
          echo "Waiting for test dependency..."

          until nc -z localhost 9999; do
            echo "Dependency not available. Waiting..."
            sleep 5
          done

          echo "Dependency available"
          echo "Tests passed"


  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment successful"